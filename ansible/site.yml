# One play, one role, every server: on-prem and AWS get exactly the same configuration.
- name: Configure every server the same way
  hosts: all
  become: true
  gather_facts: false
  pre_tasks:
    - name: Wait until the server accepts SSH
      ansible.builtin.wait_for_connection:
        timeout: 300
    - name: Wait for first-boot setup to finish (cloud-init, where the server has it)
      ansible.builtin.command: cloud-init status --wait
      register: cloud_init
      changed_when: false
      failed_when: cloud_init.rc not in [0, 2]
      when: ansible_host != '127.0.0.1'
    - name: Gather facts
      ansible.builtin.setup:
  roles:
    - baseline
